spring.application.name=backend
server.port=8080

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/stayiq_db?serverTimezone=UTC&useSSL=false}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234abcd}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool settings (Optional, but good for MVP stability)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
